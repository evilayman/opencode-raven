name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    if: github.repository == 'evilayman/opencode-raven' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    # The current integration fixtures are validated on Windows. Publishing
    # remains on a GitHub-hosted Linux runner for npm's trusted-publisher flow.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Validate release ref
        run: |
          git merge-base --is-ancestor HEAD origin/master
          bun -e 'const { version } = await Bun.file("package.json").json(); const ref = process.env.GITHUB_REF; if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Only stable versions can be published as latest"); if (ref.startsWith("refs/tags/") && ref !== `refs/tags/v${version}`) throw new Error("Tag must match package.json version");'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Run tests
        timeout-minutes: 3
        run: bun test
      - run: bun pm pack --dry-run

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check whether this version already exists
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry check failed: HTTP ${response.status}`);
          const exists = response.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!exists}\n`);
          if (exists) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${name}@${version} already exists. Skipped publication; no version or dist-tag was changed.\n`);
          NODE
      - name: Pack with Bun
        if: steps.registry.outputs.publish == 'true'
        run: bun pm pack --filename "$RUNNER_TEMP/opencode-raven.tgz"
      # npm's OIDC support uses this workflow's identity, not a stored npm token.
      - name: Publish once through npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        run: |
          npm publish "$RUNNER_TEMP/opencode-raven.tgz" --access public --tag latest
          echo "Upload accepted. Registry validation/propagation may still be pending; do not republish." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify registry availability
        if: steps.registry.outputs.publish == 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "opencode-raven@$version" version dist-tags.latest --prefer-online --json > "$RUNNER_TEMP/npm-verification.json"; then
            cat "$RUNNER_TEMP/npm-verification.json"
            node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const metadata = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-verification.json`, "utf8"));
          const verified = metadata.version === version && metadata["dist-tags.latest"] === version;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, verified
            ? `Verified opencode-raven@${version} is available as latest.\n`
            : "Uploaded, but latest-tag propagation is pending. Do not republish.\n");
          NODE
          else
            echo "::warning::Upload succeeded; registry validation/propagation is pending. Do not republish."
            echo "Uploaded; validation/propagation pending. Check registry metadata later without republishing." >> "$GITHUB_STEP_SUMMARY"
          fi
